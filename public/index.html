<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>WhatsApp Multi-Sessão</title>
    <style>
        body { background: #f3f4f6; font-family: sans-serif; min-height: 100vh; margin: 0; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 24px; }
        .tabs { display: flex; flex-direction: column; gap: 8px; }
        .tab-btn {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; border-radius: 6px; border: 1px solid #e5e7eb;
            background: #f9fafb; font-family: monospace; font-size: 1rem;
            cursor: pointer; transition: background 0.2s;
        }
        .tab-btn.active, .tab-btn:hover { background: #e0f2fe; border-color: #38bdf8; }
        .status-dot { margin-left: 8px; font-size: 0.9em; }
        .status-dot.connected { color: #16a34a; }
        .status-dot.qrcode { color: #eab308; }
        .status-dot.inactive, .status-dot.removed { color: #6b7280; }
        .status-dot.disconnected { color: #dc2626; }
        .sessao-label { font-weight: bold; }
        .sessao-status { margin-left: 10px; padding: 2px 8px; border-radius: 4px; font-size: 0.9em; }
        .sessao-status.connected { background: #bbf7d0; color: #166534; }
        .sessao-status.qrcode { background: #fef9c3; color: #a16207; }
        .sessao-status.disconnected { background: #fee2e2; color: #991b1b; }
        .sessao-status.inactive, .sessao-status.removed { background: #f3f4f6; color: #6b7280; }
        .btn { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; }
        .btn-send { background: #2563eb; color: #fff; }
        .btn-send:hover { background: #1d4ed8; }
        .btn-reativar { background: #eab308; color: #fff; }
        .btn-reativar:hover { background: #ca8a04; }
        .input { border: 1px solid #d1d5db; border-radius: 4px; padding: 6px 8px; }
        .qrcode-img { width: 192px; height: 192px; }
        .hidden { display: none !important; }
        @media (max-width: 900px) {
            .flex-row { flex-direction: column; }
            .w-1-3, .w-2-3 { width: 100% !important; }
        }
        .modal-bg {
            position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center;
        }
        .modal {
            background: #fff; border-radius: 10px; padding: 32px 32px 24px 32px; min-width: 320px; min-height: 320px;
            box-shadow: 0 4px 32px #0003; display: flex; flex-direction: column; align-items: center;
            position: relative;
        }
        .modal-close {
            position: absolute; top: 12px; right: 16px; font-size: 1.5rem; color: #888; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-size:2rem; font-weight:bold; margin-bottom:2rem; text-align:center;">Gerenciador de Sessões WhatsApp</h1>
        <div class="flex-row" style="display:flex; gap:2rem;">
            <!-- Abas de sessões -->
            <div class="w-1-3" style="width:33%;">
                <div class="card">
                    <div style="margin-bottom:1rem; display:flex; gap:8px;">
                        <input id="novoTokenInput" class="input" placeholder="Novo token da sessão" style="flex:1;">
                        <button onclick="cadastrarSessao()" class="btn btn-send">Cadastrar</button>
                    </div>
                    <div id="abas" class="tabs"></div>
                </div>
            </div>
            <!-- Detalhes da sessão -->
            <div class="w-2-3" style="width:67%;">
                <div id="sessaoMenu" class="card hidden">
                    <div style="margin-bottom:12px; display:flex; align-items:center; gap:8px;">
                        <span class="sessao-label">Sessão:</span>
                        <span id="sessaoToken" style="font-family:monospace;"></span>
                        <span id="sessaoStatus" class="sessao-status"></span>
                        <button id="btnReativar" class="btn btn-reativar hidden" onclick="reativarSessaoSelecionada()">Reativar</button>
                        <button id="btnRemover" class="btn btn-reativar hidden" style="background:#dc2626;" onclick="removerSessaoSelecionada()">Remover</button>
                        <button id="btnGerarQr" class="btn btn-send hidden" onclick="abrirModalQr(sessaoSelecionada)">Gerar QR Code</button>
                    </div>
                    <div id="qrcodeBox" class="hidden" style="margin:24px 0; display:flex; flex-direction:column; align-items:center;">
                        <div id="qrcode"></div>
                        <div id="qrcodeStatus" style="margin-top:8px; font-size:0.95em;"></div>
                    </div>
                    <div id="messageSender" class="hidden" style="display:flex; gap:8px; align-items:center;">
                        <input type="text" id="destino" class="input" placeholder="Telefone (ex: 5511999999999)">
                        <input type="text" id="mensagem" class="input" placeholder="Mensagem">
                        <button onclick="enviarMensagemSelecionada()" class="btn btn-send">Enviar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal QRCode -->
    <div id="modalQr" class="modal-bg hidden">
        <div class="modal">
            <span class="modal-close" onclick="fecharModalQr()">&times;</span>
            <div id="modalQrCode"></div>
            <div id="modalQrStatus" style="margin-top:12px; font-size:1.1em;"></div>
        </div>
    </div>
<script>
let sessaoSelecionada = null;
let pollingStatus = null;
let pollingQr = null;
let pollingModalQr = null;
let tokenModalQr = null;

// Adiciona uma aba visual para cada sessão
function adicionarAbaSessao(token, status) {
    const abas = document.getElementById('abas');
    if (!abas) return;
    if (document.getElementById('aba-' + token)) return;
    const btn = document.createElement('button');
    btn.id = 'aba-' + token;
    btn.className = 'tab-btn';
    let statusClass = 'inactive';
    if (status === 'CONNECTED' || status === 'AUTHENTICATED') statusClass = 'connected';
    else if (status === 'QRCODE') statusClass = 'qrcode';
    else if (status === 'DISCONNECTED') statusClass = 'disconnected';
    else if (status === 'REMOVED') statusClass = 'removed';
    btn.innerHTML = `
        <span>${token}</span>
        <span class="status-dot ${statusClass}">${status}</span>
    `;
    btn.onclick = function() {
        selecionarSessao(token);
    };
    abas.appendChild(btn);
}

// Seleciona uma sessão ao clicar na aba
function selecionarSessao(token) {
    document.querySelectorAll('.tab-btn').forEach(tab => tab.classList.remove('active'));
    const tab = document.getElementById('aba-' + token);
    if (tab) tab.classList.add('active');
    sessaoSelecionada = token;
    document.getElementById('sessaoToken').textContent = token;
    document.getElementById('sessaoMenu').classList.remove('hidden');
    atualizarStatusSessao(token);
    iniciarPollingStatus(token);
}

// Atualiza status da sessão e exibe menu adequado
function atualizarStatusSessao(token) {
    fetch('/status/' + encodeURIComponent(token))
        .then(res => res.json())
        .then(data => {
            const status = data.status;
            const statusSpan = document.getElementById('sessaoStatus');
            statusSpan.textContent = status;
            statusSpan.className = "sessao-status " +
                (status === 'CONNECTED' || status === 'AUTHENTICATED' ? 'connected' :
                 status === 'QRCODE' ? 'qrcode' :
                 status === 'DISCONNECTED' ? 'disconnected' :
                 status === 'REMOVED' ? 'removed' : 'inactive');
            // Mostrar/ocultar botões conforme status
            document.getElementById('btnReativar').classList.toggle('hidden', !(status === 'INACTIVE' || status === 'REMOVED' || status === 'DISCONNECTED'));
            document.getElementById('btnRemover').classList.toggle('hidden', !(status === 'REMOVED' || status === 'QRCODE' || status === 'CONNECTED' || status === 'AUTHENTICATED'));
            document.getElementById('btnGerarQr').classList.toggle('hidden', status !== 'QRCODE');
            document.getElementById('messageSender').classList.toggle('hidden', !(status === 'CONNECTED' || status === 'AUTHENTICATED'));
            if (status === 'QRCODE' || status === 'INACTIVE' || status === 'DISCONNECTED') {
                iniciarPollingQr(token);
                document.getElementById('qrcodeBox').classList.remove('hidden');
            } else {
                pararPollingQr();
                document.getElementById('qrcodeBox').classList.add('hidden');
                document.getElementById('qrcode').innerHTML = '';
                document.getElementById('qrcodeStatus').textContent = '';
            }
            // Se desconectado, alerta e atualiza abas
            if (status === 'DISCONNECTED') {
                if (sessaoSelecionada === token) {
                    alert('Sessão desconectada!');
                }
                listarSessoes();
            }
            // Se REMOVED, remove automaticamente
            if (status === 'REMOVED') {
                removerSessaoSelecionada(true);
            }
        });
}

// Lista todas as sessões do backend e cria as abas
function listarSessoes() {
    fetch('/sessions')
        .then(res => res.json())
        .then(data => {
            const abas = document.getElementById('abas');
            if (abas) abas.innerHTML = '';
            if (!data.sessions || !Array.isArray(data.sessions)) return;
            data.sessions.forEach(sessao => {
                adicionarAbaSessao(sessao.token, sessao.status);
            });
        });
}

// Cadastra uma nova sessão fixa no backend e atualiza as abas
function cadastrarSessao() {
    const input = document.getElementById('novoTokenInput');
    const token = input.value.trim();
    if (!token) {
        alert('Informe um token para a sessão.');
        return;
    }
    fetch('/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token })
    })
    .then(res => res.json())
    .then(() => {
        input.value = '';
        listarSessoes();
        abrirModalQr(token);
    });
}

// Modal QRCode
function abrirModalQr(token) {
    tokenModalQr = token;
    document.getElementById('modalQr').classList.remove('hidden');
    document.getElementById('modalQrCode').innerHTML = '<div style="text-align:center;">Carregando QR Code...</div>';
    document.getElementById('modalQrStatus').textContent = '';
    iniciarPollingModalQr(token);
}
function fecharModalQr() {
    document.getElementById('modalQr').classList.add('hidden');
    pararPollingModalQr();
    tokenModalQr = null;
}
function iniciarPollingModalQr(token) {
    pararPollingModalQr();
    pollingModalQr = setInterval(() => {
        fetch('/status/' + encodeURIComponent(token))
            .then(res => res.json())
            .then(data => {
                if (data.status === 'CONNECTED' || data.status === 'AUTHENTICATED') {
                    fecharModalQr();
                    selecionarSessao(token);
                    return;
                }
                // Se não autenticado, mostra QR
                fetch('/qrcode/' + encodeURIComponent(token))
                    .then(res => res.json())
                    .then(qrdata => {
                        if (qrdata.qr) {
                            document.getElementById('modalQrCode').innerHTML = `<img src="${qrdata.qr}" class="qrcode-img">`;
                            document.getElementById('modalQrStatus').textContent = "Aguardando leitura do QR Code...";
                        } else if (qrdata.message) {
                            document.getElementById('modalQrCode').innerHTML = '';
                            document.getElementById('modalQrStatus').textContent = qrdata.message;
                        } else if (qrdata.error) {
                            document.getElementById('modalQrCode').innerHTML = '';
                            document.getElementById('modalQrStatus').textContent = qrdata.error;
                        }
                    });
            });
    }, 1500);
}
function pararPollingModalQr() {
    if (pollingModalQr) clearInterval(pollingModalQr);
}

// Atualiza status da sessão e exibe menu adequado
function atualizarStatusSessao(token) {
    fetch('/status/' + encodeURIComponent(token))
        .then(res => res.json())
        .then(data => {
            const status = data.status;
            const statusSpan = document.getElementById('sessaoStatus');
            statusSpan.textContent = status;
            statusSpan.className = "sessao-status " +
                (status === 'CONNECTED' || status === 'AUTHENTICATED' ? 'connected' :
                 status === 'QRCODE' ? 'qrcode' :
                 status === 'DISCONNECTED' ? 'disconnected' :
                 status === 'REMOVED' ? 'removed' : 'inactive');
            // Mostrar/ocultar botões conforme status
            document.getElementById('btnReativar').classList.toggle('hidden', !(status === 'INACTIVE' || status === 'REMOVED' || status === 'DISCONNECTED'));
            document.getElementById('btnRemover').classList.toggle('hidden', !(status === 'REMOVED' || status === 'QRCODE' || status === 'CONNECTED' || status === 'AUTHENTICATED'));
            document.getElementById('btnGerarQr').classList.toggle('hidden', status !== 'QRCODE');
            document.getElementById('messageSender').classList.toggle('hidden', !(status === 'CONNECTED' || status === 'AUTHENTICATED'));
            if (status === 'QRCODE' || status === 'INACTIVE' || status === 'DISCONNECTED') {
                iniciarPollingQr(token);
                document.getElementById('qrcodeBox').classList.remove('hidden');
            } else {
                pararPollingQr();
                document.getElementById('qrcodeBox').classList.add('hidden');
                document.getElementById('qrcode').innerHTML = '';
                document.getElementById('qrcodeStatus').textContent = '';
            }
            // Se desconectado, alerta e atualiza abas
            if (status === 'DISCONNECTED') {
                if (sessaoSelecionada === token) {
                    alert('Sessão desconectada!');
                }
                listarSessoes();
            }
            // Se REMOVED, remove automaticamente
            if (status === 'REMOVED') {
                removerSessaoSelecionada(true);
            }
        });
}

// Remover sessão selecionada
function removerSessaoSelecionada(auto = false) {
    if (!sessaoSelecionada) return;
    if (!auto && !confirm('Tem certeza que deseja remover esta sessão?')) return;
    fetch('/sessions/' + encodeURIComponent(sessaoSelecionada), { method: 'DELETE' })
        .then(() => {
            listarSessoes();
            document.getElementById('sessaoMenu').classList.add('hidden');
        });
}

// Polling para status em tempo real
function iniciarPollingStatus(token) {
    pararPollingStatus();
    pollingStatus = setInterval(() => {
        if (sessaoSelecionada === token) {
            atualizarStatusSessao(token);
        }
    }, 2000);
}
function pararPollingStatus() {
    if (pollingStatus) clearInterval(pollingStatus);
}

// Polling para QR code em tempo real
function iniciarPollingQr(token) {
    pararPollingQr();
    pollingQr = setInterval(() => {
        fetch('/qrcode/' + encodeURIComponent(token))
            .then(res => res.json())
            .then(data => {
                const qrcodeBox = document.getElementById('qrcodeBox');
                const qrcodeDiv = document.getElementById('qrcode');
                const qrcodeStatus = document.getElementById('qrcodeStatus');
                if (data.qr) {
                    qrcodeBox.classList.remove('hidden');
                    qrcodeDiv.innerHTML = `<img src="${data.qr}" class="qrcode-img">`;
                    qrcodeStatus.textContent = "Aguardando leitura do QR Code...";
                } else if (data.message) {
                    qrcodeBox.classList.remove('hidden');
                    qrcodeDiv.innerHTML = '';
                    qrcodeStatus.textContent = data.message;
                } else if (data.error) {
                    qrcodeBox.classList.remove('hidden');
                    qrcodeDiv.innerHTML = '';
                    qrcodeStatus.textContent = data.error;
                }
            });
    }, 2000);
}
function pararPollingQr() {
    if (pollingQr) clearInterval(pollingQr);
}

// Reativar sessão
function reativarSessaoSelecionada() {
    if (!sessaoSelecionada) return;
    fetch('/sessions/' + encodeURIComponent(sessaoSelecionada) + '/activate', { method: 'POST' })
        .then(() => atualizarStatusSessao(sessaoSelecionada));
}

// Enviar mensagem
function enviarMensagemSelecionada() {
    if (!sessaoSelecionada) return;
    const phoneNumber = document.getElementById('destino').value;
    const message = document.getElementById('mensagem').value;
    if (!phoneNumber || !message) {
        alert('Preencha o telefone e a mensagem.');
        return;
    }
    fetch('/send/' + encodeURIComponent(sessaoSelecionada), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phoneNumber, message })
    })
    .then(res => res.text())
    .then(msg => alert(msg));
}

document.addEventListener("DOMContentLoaded", function() {
    listarSessoes();
});
</script>
</body>
</html>
